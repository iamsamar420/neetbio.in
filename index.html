            "text": "Yes, NEET Biology CBT is completely free. You can take chapter-wise tests, topic-wise tests, full mock tests, and use the anonymous doubt chat without any payment."

          "@type": "Question",
          "name": "How many NCERT chapters are covered?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "All 32 NCERT Biology chapters are covered: 19 chapters from Class 11 and 13 chapters from Class 12, aligned with the NEET syllabus."
          }
        },
        {
          "@type": "Question",
          "name": "What is the marking scheme used?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The platform follows the official NEET marking scheme: +4 for each correct answer, -1 for each wrong answer, and 0 for unattempted questions."
          }

        {
          "@type": "Question",
          "name": "What is the All India Rank Predictor?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The AIR Predictor is a simulated tool that estimates your All India Rank based on your test scores using a percentile distribution curve. It provides a visual graph showing your position relative to other candidates."
          }
        },
        {
          "@type": "Question",
          "name": "Is the doubt chat anonymous?",
